<h2 mat-dialog-title>Lịch sử các lần đo - {{ TenNguong }}</h2>
<mat-dialog-actions align="start">
  <button mat-raised-button color="primary" (click)="openAddMeasurement()">Thêm giá trị đo</button>
</mat-dialog-actions>
<mat-dialog-content>
  <div class="list-container" *ngIf="!loading">
    <div *ngIf="items.length === 0" class="empty">Không có giá trị</div>
    <table mat-table [dataSource]="items" *ngIf="items.length > 0" class="data-table">
      <ng-container matColumnDef="stt">
        <th mat-header-cell *matHeaderCellDef>STT</th>
        <td mat-cell *matCellDef="let element; let idx = index">{{ idx + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="Value">
        <th mat-header-cell *matHeaderCellDef>Giá trị</th>
        <td mat-cell *matCellDef="let element">{{ element.Value }}</td>
      </ng-container>

      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef>Ngày đo</th>
        <td mat-cell *matCellDef="let element">{{ element.Date | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="Note">
        <th mat-header-cell *matHeaderCellDef>Ghi chú</th>
        <td mat-cell *matCellDef="let element">{{ element.Note || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Thao tác</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openEditMeasurement(element)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="deleteMeasurement(element)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <div *ngIf="loading" style="display:flex; align-items:center; justify-content:center; padding:20px;"><mat-spinner diameter="36"></mat-spinner></div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Đóng</button>
</mat-dialog-actions>
