<h2 mat-dialog-title>Phân bố theo loại - {{ data.selectedLabel }}</h2>
<mat-dialog-content>
  <div class="chart-container">
    <canvas baseChart
      [data]="chartData"
      [options]="options"
      chartType="bar">
    </canvas>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Đóng</button>
</mat-dialog-actions>
