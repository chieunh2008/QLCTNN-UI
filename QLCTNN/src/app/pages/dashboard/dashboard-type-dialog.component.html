<h2 mat-dialog-title>Phân bố theo loại</h2>
<mat-dialog-content>
  <div class="dialog-subtitle">Loại: <strong>{{ data.selectedLabel }}</strong></div>
  <div class="dialog-chart-scroll">
    <app-bar-chart
      [barChartLabels]="labels"
      [barChartData]="chartData"
      [barChartOptions]="options"
      [chartStyle]="chartStyle"
      chartClass="inline-chart">
    </app-bar-chart>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Đóng</button>
</mat-dialog-actions>
